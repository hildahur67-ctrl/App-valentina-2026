<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trigo-Master Valentina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Trigonometría Teresiano</h1>
            <select id="selector-ejercicio" onchange="cambiarEjercicio()">
                <option value="0">Punto 1: Radianes a Grados</option>
                <option value="1">Punto 2: Vueltas de Rueda</option>
                <option value="2">Punto 3: Banda Transportadora</option>
                <option value="3">Punto 4: Ángulo de Depresión</option>
                <option value="4">Punto 5: Cuadrilátero ABCD</option>
                <option value="5">Punto 6: Área Triángulos</option>
                <option value="6">Punto 7: Edificio Doble Ángulo</option>
                <option value="7">Punto 8: Avión (Ley de Coseno)</option>
                <option value="8">Punto 9: Altura de la Pierna</option>
                <option value="9">Punto 10: Lado b (Ley de Seno)</option>
            </select>
            <div id="progreso-bar"><div id="avance"></div></div>
        </header>

        <main id="game-canvas">
            <canvas id="plano"></canvas>
        </main>

        <section id="interaccion">
            <div id="zona-tutorial-inicial">
                <div id="instruccion">Cargando explicación del tema...</div>
                <button id="btn-entendido" onclick="activarModoReto()">¡Listo, quiero intentarlo!</button>
            </div>
            
            <div id="zona-solucion-reto" style="display: none;">
                <div class="entrada-respuesta">
                    <input type="number" id="resultado-usuario" placeholder="Respuesta" step="0.01">
                    <button id="btn-validar" onclick="verificarRespuesta()">Validar Hito</button>
                </div>
            </div>

            <div id="explicacion-zona" style="display:none;">
                <div class="alerta-tutorial">
                    <p id="texto-explicativo"></p>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js?v=figuras_finales"></script>
</body>
</html>
