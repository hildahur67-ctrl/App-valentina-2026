<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geo-Aprendizaje Valentina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Explorador Geométrico</h1>
            <div id="progreso-bar"><div id="avance"></div></div>
        </header>

        <main id="game-canvas">
            <canvas id="plano"></canvas>
        </main>

        <section id="interaccion">
            <div id="instruccion"><b>Hito 1:</b> Hallar la distancia entre A y D</div>
            
            <div class="entrada-datos">
                <input type="number" id="resultado-usuario" placeholder="Ej: 7.07" step="0.01">
                <button onclick="verificarRespuesta()">Validar</button>
            </div>

            <div id="explicacion-zona" style="display:none;">
                <div class="alerta-tutorial">
                    <p id="texto-explicativo"></p>
                    <button class="btn-pequeno" onclick="dibujarAyudaVisual()">Ver Ayuda Visual</button>
                </div>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
