<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Química-Master Valentina</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif; 
            background-color: #f0fdf4; 
            display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        #app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
        header { background: #115e59; color: white; padding: 8px; text-align: center; flex-shrink: 0; }
        header h1 { font-size: 1.1rem; margin: 0 0 5px 0; }
        #selector-ejercicio { width: 95%; padding: 8px; font-size: 13px; border-radius: 6px; background: #134e4a; color: white; border: 1px solid #115e59; }
        #progreso-bar { width: 95%; height: 6px; background: #134e4a; border-radius: 10px; margin: 6px auto 0 auto; overflow: hidden; }
        #avance { width: 5%; height: 100%; background: #2dd4bf; transition: width 0.5s ease; }

        #game-canvas { height: 28vh; min-height: 170px; background: #ffffff; border-bottom: 1px solid #ccfbf1; position: relative; flex-shrink: 0; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        #interaccion { flex-grow: 1; overflow-y: auto; padding: 15px; background: white; -webkit-overflow-scrolling: touch; }
        #zona-tutorial-inicial { display: flex; flex-direction: column; gap: 10px; }
        #btn-entendido { padding: 12px; background: #14b8a6; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .entrada-respuesta { display: flex; gap: 8px; justify-content: center; margin: 15px 0; }
        input[type="text"] { padding: 10px; border: 2px solid #14b8a6; border-radius: 8px; width: 160px; font-size: 16px; text-align: center; }
        #btn-validar { padding: 10px 18px; background: #0d9488; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; }
        .alerta-tutorial { background: #fef9c3; padding: 12px; border-radius: 8px; border-left: 4px solid #eab308; margin-bottom: 40px; font-size: 13px; color: #713f12; line-height: 1.5; }
    </style>
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Química Teresiano - Trimestre I</h1>
            <select id="selector-ejercicio" onchange="cambiarEjercicio()">
                <option value="0">Punto 1: Configuración y Capa de Valencia (Carbono)</option>
                <option value="1">Punto 1.2: Electrones y Regla del Octeto (Sodio)</option>
                <option value="2">Punto 2: Moléculas Diatómicas (Cl2 - Enlaces)</option>
                <option value="3">Punto 3: Clasificación de Reacciones (Síntesis)</option>
                <option value="4">Punto 3.2: Reacción de Combustión</option>
                <option value="5">Punto 4: Conteo de Átomos (Reactivos vs Productos)</option>
                <option value="6">Punto 5: Verificar Balanceo de Ecuaciones</option>
                <option value="7">Punto 6: Balanceo por Tanteo (Fe + O2)</option>
                <option value="8">Punto 7: Estados de Oxidación (Redox)</option>
                <option value="9">Punto 7.2: Agente Oxidante y Reducido</option>
            </select>
            <div id="progreso-bar"><div id="avance"></div></div>
        </header>

        <div id="game-canvas">
            <canvas id="plano"></canvas>
        </div>

        <section id="interaccion">
            <div id="zona-tutorial-inicial">
                <div id="instruccion">Cargando bitácora de laboratorio...</div>
                <button id="btn-entendido" onclick="activarModoReto()">¡Listo, quiero intentarlo!</button>
            </div>
            
            <div id="zona-solucion-reto" style="display: none;">
                <div class="entrada-respuesta">
                    <input type="text" id="resultado-usuario" placeholder="Tu respuesta">
                    <button id="btn-validar" onclick="verificarRespuesta()">Validar Hito</button>
                </div>
            </div>

            <div id="explicacion-zona" style="display:none;">
                <div class="alerta-tutorial">
                    <p id="texto-explicativo"></p>
                </div>
            </div>
        </section>
    </div>
 <script src="script_quimica.js?v=motor_activo"></script>
</body>
</html>
