<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Química-Master Valentina</title>
    <link rel="stylesheet" href="style.css?v=final_trigo">
</head>
<body>
    <div id="app-container">
        <header>
            <h1>Química Teresiano - Trimestre I</h1>
            <select id="selector-ejercicio" onchange="cambiarEjercicio()">
                <option value="0">Bloque 1: Capa de Valencia (Punto 1)</option>
                <option value="1">Bloque 2: Regla del Octeto (Punto 1.2)</option>
                <option value="2">Bloque 3: Enlaces Covalentes (Punto 2)</option>
                <option value="3">Bloque 4: Clasificación de Reacciones (Punto 3)</option>
                <option value="4">Bloque 5: Conteo y Verificación (Puntos 4 y 5)</option>
                <option value="5">Bloque 6: Coeficientes por Tanteo (Punto 6)</option>
                <option value="6">Bloque 7: Estados de Oxidación y Redox (Punto 7)</option>
            </select>
            <div id="progreso-bar"><div id="avance"></div></div>
        </header>

        <div id="game-canvas">
            <canvas id="plano"></canvas>
        </div>

        <section id="interaccion">
            <div id="zona-tutorial-inicial">
                <div id="instruccion">Cargando bitácora de laboratorio...</div>
                <button id="btn-entendido" onclick="activarModoReto()">¡Listo, quiero intentarlo!</button>
            </div>
            
            <div id="zona-solucion-reto" style="display: none;">
                <div class="entrada-respuesta">
                    <input type="text" id="resultado-usuario" placeholder="Tu respuesta">
                    <button id="btn-validar" onclick="verificarRespuesta()">Validar Hito</button>
                </div>
            </div>

            <div id="explicacion-zona" style="display:none;">
                <div class="alerta-tutorial">
                    <p id="texto-explicativo"></p>
                </div>
            </div>
        </section>
    </div>
    <script src="script_quimica.js?v=sincronizacion_total"></script>
</body>
</html>
